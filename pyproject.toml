[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioseq-platform"
version = "0.1.0"
description = "Offline, reproducible small-scale biological sequence alignment"
requires-python = ">=3.10"
license = { text = "Proprietary" }

[project.scripts]
bioseq = "bioseq_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
